<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Náutico</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:Arial;
}


.topo{

height:60px;
background:#333;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

}



#mapa{

height:calc(100vh - 140px);

}



.menu{

position:fixed;

bottom:0;
left:0;

width:100%;

height:80px;

background:#444;

display:flex;

justify-content:space-around;

align-items:center;

z-index:1000;

}



button{

background:#1976d2;

color:white;

border:0;

padding:14px 20px;

border-radius:12px;

font-size:17px;

}



input[type="file"]{

display:none;

}



#lista{

display:none;

position:absolute;

top:70px;

left:10px;

right:10px;

background:white;

max-height:75vh;

overflow:auto;

padding:15px;

border-radius:10px;

z-index:3000;

}



.item{

background:#ddd;

padding:12px;

margin:8px;

border-radius:8px;

font-size:18px;

}



#centroGPS{

display:none;

margin-top:15px;

background:#eee;

padding:10px;

border-radius:10px;

}


</style>

</head>


<body>


<div class="topo">

🚤 GPS Náutico

</div>


<div id="mapa"></div>



<div id="lista">


<h2>🛥 Trilhas</h2>


<div id="listaItens"></div>


<button onclick="fecharLista()">

Fechar

</button>



<div id="centroGPS">


Centro autom.


<label>

<input
type="radio"
name="gps"
onclick="ativarGPS(true)">

sim

</label>



<label>

<input
type="radio"
name="gps"
checked
onclick="ativarGPS(false)">

não

</label>


</div>



</div>


<input
id="arquivoGPX"
type="file"
accept=".gpx"
onchange="importarGPX(event)"
>



<div class="menu">


<button onclick="abrirLista()">

🛥 Trilhas

</button>



<button onclick="document.getElementById('arquivoGPX').click()">

📂 Importar GPX

</button>


</div>

 <script>


let mapa = L.map('mapa').setView([-25,-48],13);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(mapa);



let trilhaAtual=null;

let marcadorGPS=null;

let seguirGPS=false;



let trilhas =
JSON.parse(
localStorage.getItem("trilhasGPS")
) || [];





function importarGPX(event){


let arquivo=event.target.files[0];


if(!arquivo)return;



let leitor=new FileReader();



leitor.onload=function(e){

lerGPX(e.target.result);

};



leitor.readAsText(arquivo);


}





function lerGPX(texto){


let xml =
new DOMParser()
.parseFromString(texto,"text/xml");



let tracks =
xml.getElementsByTagName("trk");



trilhas=[];



for(let i=0;i<tracks.length;i++){


let nome="Trilha "+(i+1);



let nomeXML =
tracks[i]
.getElementsByTagName("name")[0];



if(nomeXML){

nome=nomeXML.textContent;

}



let pontos=[];



let pts =
tracks[i]
.getElementsByTagName("trkpt");



for(let j=0;j<pts.length;j++){


pontos.push([


parseFloat(
pts[j].getAttribute("lat")
),


parseFloat(
pts[j].getAttribute("lon")
)


]);


}



trilhas.push({

nome:nome,

pontos:pontos

});


}



localStorage.setItem(

"trilhasGPS",

JSON.stringify(trilhas)

);



alert(
trilhas.length+" trilhas salvas"
);



abrirLista();


}




function abrirLista(){


let lista =
document.getElementById("lista");


let itens =
document.getElementById("listaItens");



itens.innerHTML="";



trilhas.forEach(function(t,i){


let div =
document.createElement("div");



div.className="item";



div.innerHTML=

"🟢 "+t.nome+
"<br>Pontos: "+
t.pontos.length;



div.onclick=function(){

carregarTrilha(i);

};



itens.appendChild(div);



});



lista.style.display="block";


}





function fecharLista(){


document.getElementById("lista")
.style.display="none";


}




function carregarTrilha(i){


let t=trilhas[i];



if(trilhaAtual){

mapa.removeLayer(trilhaAtual);

}



trilhaAtual =
L.polyline(

t.pontos,

{

color:"red",

weight:5

}

).addTo(mapa);



mapa.fitBounds(
trilhaAtual.getBounds()
);



document.getElementById("centroGPS")
.style.display="block";



fecharLista();


}

  function ativarGPS(valor){

seguirGPS = valor;


if(valor){

iniciarGPS();

}

}




function iniciarGPS(){


if(!navigator.geolocation){

alert("GPS não disponível");

return;

}



navigator.geolocation.watchPosition(


function(pos){


let lat =
pos.coords.latitude;


let lon =
pos.coords.longitude;



if(!marcadorGPS){


marcadorGPS =
L.marker(

[lat,lon],

{

title:"Minha posição"

}

).addTo(mapa);



}else{


marcadorGPS.setLatLng(

[lat,lon]

);


}



if(seguirGPS){


mapa.setView(

[lat,lon],

16

);


}


},



function(){

alert(
"Permita o GPS do celular"
);

},



{

enableHighAccuracy:true,

maximumAge:1000

}



);


}



</script>


</body>

</html>
