<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Náutico</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:Arial;
}



.topo{

height:60px;
background:#333;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

}



#mapa{

height:calc(100vh - 140px);

}



.menu{

position:fixed;

bottom:0;
left:0;

width:100%;

height:80px;

background:#444;

display:flex;

justify-content:space-around;

align-items:center;

z-index:1000;

}



button{

background:#1976d2;

color:white;

border:0;

padding:14px;

border-radius:12px;

font-size:17px;

}



input{

display:none;

}



#lista{

display:none;

position:absolute;

top:70px;

left:10px;

right:10px;

max-height:70vh;

overflow:auto;

background:white;

padding:15px;

border-radius:10px;

z-index:2000;

}



.item{

background:#ddd;

padding:12px;

margin:8px;

border-radius:8px;

font-size:18px;

}


</style>

</head>


<body>


<div class="topo">

🚤 GPS Náutico

</div>


<div id="mapa"></div>


<div id="lista">

<h2>🛥 Trilhas</h2>

<div id="listaItens"></div>


<button onclick="fecharLista()">

Fechar

</button>

</div>


<input 
id="arquivoGPX"
type="file"
accept=".gpx"
onchange="importarGPX(event)"
>


<div class="menu">


<button onclick="abrirLista()">

🛥 Trilhas

</button>



<button onclick="document.getElementById('arquivoGPX').click()">

📂 Importar GPX

</button>


</div>
<script>


let mapa = L.map('mapa').setView([-25,-48],13);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(mapa);



let trilhaAtual = null;



let trilhas = JSON.parse(
localStorage.getItem("trilhasGPS")
) || [];





function importarGPX(event){


let arquivo = event.target.files[0];


if(!arquivo) return;



let leitor = new FileReader();



leitor.onload=function(e){


lerArquivoGPX(
e.target.result
);


};



leitor.readAsText(arquivo);



}




function lerArquivoGPX(texto){


let xml = new DOMParser()
.parseFromString(
texto,
"text/xml"
);



let tracks =
xml.getElementsByTagName("trk");



trilhas=[];



for(let i=0;i<tracks.length;i++){



let nome =
tracks[i]
.getElementsByTagName("name")[0];



if(nome){

nome=nome.textContent;

}
else{

nome="Trilha "+(i+1);

}



let pontos=[];



let pontosXML =
tracks[i]
.getElementsByTagName("trkpt");



for(let j=0;j<pontosXML.length;j++){


pontos.push([

parseFloat(
pontosXML[j].getAttribute("lat")
),


parseFloat(
pontosXML[j].getAttribute("lon")
)

]);


}




trilhas.push({

nome:nome,

pontos:pontos

});


}




localStorage.setItem(

"trilhasGPS",

JSON.stringify(trilhas)

);



alert(

trilhas.length+
" trilhas salvas"

);


abrirLista();


}




function abrirLista(){


let div =
document.getElementById("lista");


let itens =
document.getElementById("listaItens");



itens.innerHTML="";



trilhas.forEach(
function(t,index){


let b=document.createElement("div");


b.className="item";


b.innerHTML=
"🟢 "+t.nome+
"<br>Pontos: "+
t.pontos.length;



b.onclick=function(){

carregarTrilha(index);

};



itens.appendChild(b);


}

);



div.style.display="block";


}




function fecharLista(){

document.getElementById("lista")
.style.display="none";

}




function carregarTrilha(index){


let t =
trilhas[index];



if(trilhaAtual){

mapa.removeLayer(trilhaAtual);

}



trilhaAtual =
L.polyline(

t.pontos,

{

color:"red",

weight:5

}

).addTo(mapa);



mapa.fitBounds(
trilhaAtual.getBounds()
);



fecharLista();


}

 </script>


</body>

</html>
