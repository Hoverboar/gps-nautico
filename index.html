<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Náutico</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:Arial;
}


.topo{
height:60px;
background:#333;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;
}


#mapa{
height:calc(100vh - 140px);
}



.menu{

position:fixed;
bottom:0;
width:100%;
height:80px;

background:#444;

display:flex;
justify-content:space-around;
align-items:center;

z-index:1000;

}



button{

background:#1976d2;

color:white;

border:0;

padding:14px 20px;

border-radius:12px;

font-size:17px;

}



#painelZoom{

position:absolute;

top:70px;

right:10px;

background:white;

padding:10px;

border-radius:10px;

z-index:2000;

font-size:18px;

}



#lista{

display:none;

position:absolute;

top:70px;

left:10px;

right:10px;

background:white;

padding:15px;

border-radius:10px;

z-index:3000;

}



.item{

background:#ddd;

padding:12px;

margin:8px;

border-radius:8px;

font-size:18px;

}



#centroGPS{

display:none;

position:absolute;

bottom:95px;

left:50%;

transform:translateX(-50%);

background:white;

padding:12px 20px;

border-radius:20px;

z-index:3000;

font-size:18px;

}



input[type=file]{

display:none;

}

</style>

</head>


<body>


<div class="topo">

🚤 GPS Náutico

</div>


<div id="mapa"></div>



<div id="painelZoom">

Zoom: <span id="valorZoom">18</span>

<br><br>

<button onclick="zoomMenos()">-</button>

<button onclick="zoomMais()">+</button>

</div>



<div id="lista">

<h2>🛥 Trilhas</h2>

<div id="listaItens"></div>


<button onclick="fecharLista()">

Fechar

</button>

</div>



<div id="centroGPS">


Centro autom.


<input type="radio"
name="gps"
onclick="ativarGPS(true)">

sim


<input type="radio"
name="gps"
checked
onclick="ativarGPS(false)">

não


</div>



<input id="arquivoGPX"
type="file"
accept=".gpx"
onchange="importarGPX(event)">



<div class="menu">


<button onclick="abrirLista()">

🛥 Trilhas

</button>


<button onclick="document.getElementById('arquivoGPX').click()">

📂 Importar GPX

</button>


</div>

 <script>


let mapa = L.map('mapa')
.setView([-25,-48],18);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{
maxZoom:19
}

).addTo(mapa);




let trilhaAtual=null;

let pontosMapa=[];

let bandeira=null;

let marcadorGPS=null;

let seguirGPS=false;

let timerOpcao;



let trilhas =
JSON.parse(
localStorage.getItem("trilhasGPS")
) || [];






// atualiza número do zoom

mapa.on('zoomend',function(){

document.getElementById("valorZoom").innerHTML =
mapa.getZoom();

});





function zoomMais(){

let z=mapa.getZoom();


if(z<19){

mapa.setZoom(z+1);

}

}





function zoomMenos(){

let z=mapa.getZoom();


if(z>0){

mapa.setZoom(z-1);

}

}







function importarGPX(event){


let arquivo =
event.target.files[0];


if(!arquivo)return;



let leitor=new FileReader();



leitor.onload=function(e){

lerGPX(e.target.result);

};



leitor.readAsText(arquivo);


}






function lerGPX(texto){


let xml =
new DOMParser()
.parseFromString(texto,"text/xml");



let tracks =
xml.getElementsByTagName("trk");



trilhas=[];



for(let i=0;i<tracks.length;i++){


let nome="Trilha "+(i+1);



let nomeTag =
tracks[i]
.getElementsByTagName("name")[0];



if(nomeTag){

nome=nomeTag.textContent;

}



let pontos=[];



let pts =
tracks[i]
.getElementsByTagName("trkpt");



for(let j=0;j<pts.length;j++){


pontos.push([


parseFloat(
pts[j].getAttribute("lat")
),


parseFloat(
pts[j].getAttribute("lon")
)


]);


}



trilhas.push({

nome:nome,

pontos:pontos

});


}



localStorage.setItem(

"trilhasGPS",

JSON.stringify(trilhas)

);



alert(
trilhas.length+" trilhas salvas"
);



abrirLista();


}





function abrirLista(){


let lista =
document.getElementById("lista");


let itens =
document.getElementById("listaItens");



itens.innerHTML="";



trilhas.forEach(function(t,i){


let div =
document.createElement("div");



div.className="item";



div.innerHTML=

"🚤 "+t.nome+
"<br>Pontos: "+t.pontos.length;



div.onclick=function(){

carregarTrilha(i);

};



itens.appendChild(div);


});



lista.style.display="block";


}





function fecharLista(){

document.getElementById("lista")
.style.display="none";

}

  function limparMapa(){


if(trilhaAtual){

mapa.removeLayer(trilhaAtual);

}



pontosMapa.forEach(function(p){

mapa.removeLayer(p);

});


pontosMapa=[];



if(bandeira){

mapa.removeLayer(bandeira);

bandeira=null;

}


}






function mostrarOpcao(){


let opcao =
document.getElementById("centroGPS");


opcao.style.display="block";


clearTimeout(timerOpcao);



timerOpcao=setTimeout(function(){


opcao.style.display="none";


},5000);


}






function carregarTrilha(i){


let t=trilhas[i];


limparMapa();



// linha da trilha

trilhaAtual =
L.polyline(

t.pontos,

{

color:"red",

weight:5

}

).addTo(mapa);




// pontos

t.pontos.forEach(function(p){


let ponto =
L.circleMarker(

p,

{

radius:6,

color:"red",

fillColor:"red",

fillOpacity:1

}

).addTo(mapa);



pontosMapa.push(ponto);


});




// bandeira

bandeira =
L.marker(

t.pontos[0],

{

icon:L.divIcon({

html:"🚩",

className:"",

iconSize:[30,30]

})

}

).addTo(mapa);





// abre sempre no zoom 18

mapa.setView(

t.pontos[0],

18

);




// mostra opção

mostrarOpcao();



// começa em NÃO

document.querySelector(

'input[onclick="ativarGPS(false)"]'

).checked=true;



seguirGPS=false;



fecharLista();


}







// tocar na tela mostra novamente por 5 segundos

mapa.on('click',function(){


mostrarOpcao();


});







function ativarGPS(valor){


seguirGPS=valor;



if(valor){

iniciarGPS();

}

}






function iniciarGPS(){


if(!navigator.geolocation){

alert("GPS não disponível");

return;

}



navigator.geolocation.watchPosition(


function(pos){


let lat =
pos.coords.latitude;


let lon =
pos.coords.longitude;



if(!marcadorGPS){


marcadorGPS =
L.marker(

[lat,lon]

).addTo(mapa);



}else{


marcadorGPS.setLatLng(

[lat,lon]

);


}



if(seguirGPS){


mapa.setView(

[lat,lon],

18

);


}


},



function(){

alert("Permita o GPS do celular");

},



{

enableHighAccuracy:true,

maximumAge:1000

}



);


}



</script>


</body>

</html>
