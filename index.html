
<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>GPS Náutico</title>

<style>

body{

}

input{

</head>

🚤 GPS Náutico

</button>


<label>

<button>
📂 Importar GPX
</button>

<input type="file" accept=".gpx">

</label>


</div>

alert("Lista de trilhas");

}

</html>
