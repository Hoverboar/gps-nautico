<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Náutico</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<style>

body{
margin:0;
font-family:Arial;
}


.topo{

height:60px;
background:#333;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:25px;

}


#mapa{

height:calc(100vh - 140px);

}



.menu{

position:fixed;

bottom:0;
left:0;

width:100%;

height:80px;

background:#444;

display:flex;

justify-content:space-around;

align-items:center;

z-index:1000;

}



button{

background:#1976d2;

color:white;

border:0;

padding:15px;

border-radius:12px;

font-size:17px;

}



#listaTrilhas{

display:none;

position:absolute;

top:70px;

left:10px;

right:10px;

background:white;

padding:15px;

border-radius:10px;

z-index:2000;

box-shadow:0 0 10px #555;

}


input{

display:none;

}


</style>

</head>


<body>


<div class="topo">

🚤 GPS Náutico

</div>


<div id="mapa"></div>


<div id="listaTrilhas">

<h2>Gerenciador de Rotas</h2>


<button onclick="fecharTrilhas()">
Fechar
</button>


<hr>


<p>🟢 valter</p>

<p>🟢 biguá plataforma antiga</p>


</div>


<input
id="arquivoGPX"
type="file"
accept=".gpx"
onchange="importarGPX(event)"
>


<div class="menu">


<button onclick="abrirTrilhas()">

🛥 Trilhas

</button>


<button onclick="document.getElementById('arquivoGPX').click()">

📂 Importar GPX

</button>


</div>
<script>


let mapa = L.map('mapa').setView([-25,-48],13);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(mapa);



let trilha = null;



function abrirTrilhas(){

document.getElementById("listaTrilhas").style.display="block";

}



function fecharTrilhas(){

document.getElementById("listaTrilhas").style.display="none";

}




function importarGPX(event){


let arquivo = event.target.files[0];


if(!arquivo){
return;
}


let leitor = new FileReader();



leitor.onload=function(e){


mostrarTrilha(e.target.result, arquivo.name);


};



leitor.readAsText(arquivo);


}





function mostrarTrilha(texto,nome){


let xml = new DOMParser()
.parseFromString(texto,"text/xml");



let pontos=[];



let lista =
xml.getElementsByTagName("trkpt");



for(let i=0;i<lista.length;i++){


let lat =
parseFloat(
lista[i].getAttribute("lat")
);



let lon =
parseFloat(
lista[i].getAttribute("lon")
);



pontos.push(
[
lat,
lon
]
);



}




if(trilha){

mapa.removeLayer(trilha);

}



trilha =
L.polyline(

pontos,

{
color:"red",
weight:5
}

).addTo(mapa);



mapa.fitBounds(
trilha.getBounds()
);



}
</script>


</body>

</html>
